 const content={expected:['期望教室','<p>临时选择想去的教室，优先级低于收藏</p><div class="modal-options"><button data-preview-choice aria-pressed="false">2-201</button><button data-preview-choice aria-pressed="false">3-305</button></div>'],marks:['教室标记','<p>2-201 · 已收藏 · 有插座 · 人少</p><p>3-305 · 桌椅舒适</p><p class="modal-note">这里只展示布局样例，不读写真实标记</p>'],preferences:['规划偏好','<p>默认偏好：综合推荐</p><p>默认宽松模式：开启</p><p>常用时段组合：工作日、周末</p>'],guide:['使用指引','<p>查询教室 → 管理教室 → 规划自习 → 设置与帮助</p><p class="modal-note">本轮只演示主页面；正式版指引和目录不变</p>'],about:['关于 YOURoom','<p>北邮空闲教室查询与使用规划个人助手<br>非学校官方应用</p><p>空闲信息来自学校教务，并非实时空座</p><p class="modal-note">关于页沿用已定稿设计，本轮不调整</p>'],'clear-cache':['清除缓存','<p>正式应用会先要求确认，并使用当前登录账密校验身份，通过后才删除全部本地数据</p><p class="modal-note">仅设计演示：此处不会校验账号，也不会清除任何数据</p>'],logout:['退出登录','<p>退出登录仍保留个人使用数据</p><p class="modal-note">仅设计演示：不会退出正式应用或改变登录状态</p>']};
 if(content[action])openModal(app,...content[action]);
}
function bindPhone(app){const el=phone(app);let start=null;
 el.addEventListener('pointerdown',e=>{const face=e.target.closest('.room-face'),head=e.target.closest('.app-head'),theme=e.target.closest('.theme-picker');if(face||head||theme)start={x:e.clientX,y:e.clientY,face,head,theme};});
 el.addEventListener('pointerup',e=>{if(!start)return;const {x,y,face,head,theme}=start;start=null;const dx=e.clientX-x,dy=e.clientY-y;if(Math.abs(dx)<45||Math.abs(dx)<Math.abs(dy)*1.4)return;if(face){app.openRoom=dx<0?face.dataset.name:null;refreshRooms(app);app.ignoreClick=performance.now()+200}else if(head){app.campus=app.campus==='西土城'?'沙河':'西土城';$('[data-campus]',el).textContent=app.campus;showToast(app,'校区已切换；教室为示例数据')}else if(theme){stepTheme(app,dx<0?1:-1);app.ignoreClick=performance.now()+200}});
 el.addEventListener('pointercancel',()=>{start=null});
 el.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!el.contains(b)||performance.now()<(app.ignoreClick||0))return;
 if(b.dataset.nav){closeModal(app);renderPage(app,b.dataset.nav);return}
 if(b.dataset.themeStep){stepTheme(app,+b.dataset.themeStep);return}
 if(b.dataset.slot){const n=+b.dataset.slot;app.slots.has(n)?app.slots.delete(n):app.slots.add(n);refreshRooms(app);return}
 if(b.dataset.wheelValue){b.parentElement.scrollTo({top:+b.dataset.wheelValue*40,behavior:'smooth'});return}
 if(b.dataset.building){app.building=b.dataset.building;$$('[data-building]',el).forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.building===app.building)));if(app.page==='rooms')refreshRooms(app);return}
 if(b.dataset.roomTag){const r=app.rooms.find(r=>r.name===app.editingRoom),t=b.dataset.roomTag;r.tags=r.tags.includes(t)?r.tags.filter(x=>x!==t):r.tags.concat(t);b.setAttribute('aria-pressed',String(r.tags.includes(t)));refreshRooms(app);return}
 if(b.hasAttribute('data-preview-choice')){b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));return}
 if(b.dataset.strip){app.strip=b.dataset.strip;$('[data-strip-value]',el).textContent=app.strip;$$('[data-strip]',el).forEach(x=>x.setAttribute('aria-checked',String(x.dataset.strip===app.strip)));return}
 if(b.dataset.default){app.defaultCampus=b.dataset.default;$('[data-default-campus]',el).textContent=app.defaultCampus;$$('[data-default]',el).forEach(x=>x.setAttribute('aria-checked',String(x.dataset.default===app.defaultCampus)));return}
 if(b.dataset.period!==undefined){app.menu=app.menu===+b.dataset.period?null:+b.dataset.period;refreshPlan(app);return}
 if(b.dataset.periodAction){const a=b.dataset.periodAction;if(a==='edit'){[app.start,app.end]=app.periods[app.menu];app.periods.splice(app.menu,1);app.menu=null;renderPage(app,'planner')}else if(a==='delete'){app.periods.splice(app.menu,1);app.menu=null;refreshPlan(app)}else{openModal(app,'保存时段组合','<p>'+app.periods.map(p=>time(p[0])+'–'+time(p[1])).join('<br>')+'</p><p class="modal-note">组合保存功能不变；此处仅预览，不写入真实数据</p>')}return}
 if(b.dataset.option!==undefined){app.option=+b.dataset.option;refreshPlan(app);return}
 const action=b.dataset.action;
 if(action==='room'){app.openRoom=app.openRoom===b.dataset.name?null:b.dataset.name;refreshRooms(app)}
 else if(b.dataset.roomAction){const r=app.rooms.find(x=>x.name===b.dataset.name),a=b.dataset.roomAction;if(a==='favorite'){r.favorite=!r.favorite;refreshRooms(app)}else if(a==='exclude'){r.excluded=true;app.openRoom=null;refreshRooms(app);showToast(app,'已在本次预览中排除该教室；可重置演示')}else detailModal(app,a,r.name)}
 else if(action==='clear-slots'){app.slots.clear();refreshRooms(app)}
 else if(action==='clear-search'){app.query='';$('input[type=search]',el).value='';refreshRooms(app)}
 else if(action==='campus'){app.campus=app.campus==='西土城'?'沙河':'西土城';$('[data-campus]',el).textContent=app.campus;showToast(app,'已切换为'+app.campus+'；这里使用示例教室')}
 else if(action==='dark'){app.dark=!app.dark;applyTheme(app)}
 else if(action==='numbers'){app.numbers=!app.numbers;b.setAttribute('aria-checked',String(app.numbers))}
 else if(action==='strip-options'||action==='campus-options'){const target=$('[data-options="'+(action==='strip-options'?'strip':'campus')+'"]',el);target.hidden=!target.hidden;b.setAttribute('aria-expanded',String(!target.hidden))}
 else if(action==='flexible'){app.flexible=!app.flexible;b.classList.toggle('selected',app.flexible);b.setAttribute('aria-pressed',String(app.flexible));$('.plan-feedback',el).textContent=app.flexible?'已启用宽松模式':'已关闭宽松模式'}
 else if(action==='add-period'){if(app.periods.length>=3){showToast(app,'最多添加三个时段');return}if(app.end-app.start<30){showToast(app,'请设置不少于30分钟的时段');return}if(app.periods.some(p=>app.start<p[1]&&app.end>p[0])){showToast(app,'与已添加的时段重叠');return}app.periods.push([app.start,app.end]);refreshPlan(app);$('.plan-feedback',el).textContent='已添加 '+time(app.start)+'–'+time(app.end)}
 else if(action==='generate'){if(app.busy){app.busy=false;clearTimeout(app.generationTimer);b.innerHTML=icon('play');b.setAttribute('aria-label','生成规划');$('.plan-feedback',el).textContent='已停止演示规划';return}if(!app.periods.length){showToast(app,'请先添加一个时段');return}const windows=structuredClone(app.periods);app.busy=true;b.innerHTML=icon('stop');b.setAttribute('aria-label','停止规划');$('.plan-feedback',el).textContent='比较时间与完整路线…';app.generationTimer=setTimeout(()=>{app.busy=false;app.route=true;app.routePeriods=windows;app.option=0;const launch=$('[data-action="generate"]',el);if(launch){launch.innerHTML=icon('play');launch.setAttribute('aria-label','生成规划')}refreshPlan(app);const feedback=$('.plan-feedback',el);if(feedback)feedback.textContent='已生成 3 个示例方案 · 未执行真实计算'},600)}
 else if(action==='alternatives'){app.expandedPlan=!app.expandedPlan;refreshPlan(app)}
 else if(action==='close-modal')closeModal(app);
 else detailModal(app,action);
 });
 el.addEventListener('input',e=>{if(e.target.matches('input[type=search]')){app.query=e.target.value;refreshRooms(app)}if(e.target.matches('textarea')){const r=app.rooms.find(r=>r.name===app.editingRoom);r.note=e.target.value.slice(0,20);$('.modal-counter',el).textContent=r.note.length+'/20';refreshRooms(app)}});
 el.addEventListener('keydown',e=>{const modal=$('.phone-overlay',el);if(e.key==='Escape'&&modal){e.preventDefault();closeModal(app)}if(e.key==='Tab'&&modal){const items=$$('button:not(:disabled),input,textarea,[tabindex="0"]',modal);if(!items.length)return;const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
}
function stepTheme(app,direction){app.theme=THEMES[(THEMES.findIndex(t=>t.id===app.theme)+direction+THEMES.length)%THEMES.length].id;applyTheme(app)}
function setPage(page){selectedPage=page;$$('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===page)));apps.forEach(app=>renderPage(app,page))}
$('#theme-select').innerHTML=THEMES.map(t=>'<option value="'+t.id+'">'+t.name+'</option>').join('');$('#theme-select').value=selectedTheme;
$('#theme-select').addEventListener('change',e=>{selectedTheme=e.target.value;apps.forEach(app=>{app.theme=selectedTheme;applyTheme(app)})});
$$('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
$$('button[data-mode]').forEach(b=>b.addEventListener('click',()=>{globalMode=b.dataset.mode;document.documentElement.dataset.mode=globalMode;$$('button[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.mode===globalMode)));apps.forEach(app=>{app.dark=globalMode==='dark';applyTheme(app)})}));
$('#reset').addEventListener('click',()=>{apps.forEach(app=>{clearTimeout(app.generationTimer);clearTimeout(app.toastTimer)});createStudies()});
createStudies();
</script>
