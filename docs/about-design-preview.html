<!doctype html>
<html lang="zh-CN" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>YOURoom · 关于页面 · 三版设计</title>
<style>
/* Visual thesis: an editorial companion to the guide contents, with native theme planes and unhurried reading.
   Content plan: brand/version → project/feedback → data/use → local/login → author.
   Interaction thesis: brief cover entrance; restrained link movement; smooth in-sheet reading navigation.
   All product copy/URLs come from AboutContent.kt; palettes from the approved native-theme snapshot.
   Offline prototype only: no persistence, app mutations, external fonts, or automatic network requests. */
:root{color-scheme:light;--canvas:#f4f3ef;--page-ink:#313a38;--page-muted:#647068;--page-rule:#d6dbd4;--text-scale:1}
:root[data-mode=dark]{color-scheme:dark;--canvas:#191e1c;--page-ink:#e8ece4;--page-muted:#aeb9ae;--page-rule:#3d4840}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--page-ink);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}
button,select{font:inherit;color:inherit}button{padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid currentColor;outline-offset:4px}
[hidden]{display:none!important}a{color:inherit}svg{display:block}
.icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sprite{position:absolute;width:0;height:0;overflow:hidden}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.page-head,main,.page-foot{width:min(1440px,100%);margin:auto;padding-left:32px;padding-right:32px}
.page-head{padding-top:28px}.identity{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.brand{font-size:30px;font-weight:750;letter-spacing:-1px}.document-name{font-size:11px;color:var(--page-muted);letter-spacing:.08em}
h1{font-size:25px;line-height:1.4;margin:24px 0 8px;font-weight:550;letter-spacing:.02em}
.intro{margin:0;color:var(--page-muted);font-size:12px;line-height:1.9}
.controls{margin:23px 0 24px;border-top:1px solid var(--page-rule);border-bottom:1px solid var(--page-rule);padding:14px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
.control-group{display:flex;align-items:center;flex-wrap:wrap;gap:16px}.control-group label{font-size:11px;display:flex;align-items:center;gap:9px}
select{border:1px solid var(--page-rule);border-radius:4px;padding:6px 25px 6px 9px;background:var(--canvas);font-size:12px;max-width:180px}
.segments{display:flex;gap:2px;border:1px solid var(--page-rule);border-radius:5px;padding:2px}
.segments button{font-size:11px;padding:6px 12px;border-radius:3px}.segments button[aria-pressed=true]{background:var(--page-ink);color:var(--canvas)}
.state-note{min-height:18px;font-size:11px;color:var(--page-muted);margin:0 0 14px}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px;align-items:start}
.study{min-width:0;animation:arrive .42s both;animation-delay:calc(var(--order)*65ms)}
.design-label{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}.design-letter{font:italic 34px/1 Georgia,serif;color:var(--page-muted)}
.design-label h2{font-size:16px;font-weight:600;margin:0}.design-label small{font-size:10px;color:var(--page-muted);margin-left:auto}
.phone{position:relative;isolation:isolate;padding:67px 12px 24px;border:1px solid var(--rule);border-radius:31px;background:var(--paper);color:var(--ink);overflow:hidden;min-height:960px}
.status{position:absolute;top:15px;left:27px;right:24px;height:18px;display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--ink);z-index:1;pointer-events:none}
.status svg{width:42px;height:10px;fill:currentColor}.home{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);height:4px;width:92px;border-radius:3px;background:var(--ink);opacity:.55}
.settings-backdrop{position:absolute;inset:42px 0 18px;z-index:-2;background:var(--paper);overflow:hidden}
.backdrop-name{font-size:25px;font-weight:650;padding:24px 24px 40px;background:var(--control)}
.backdrop-line{margin:0 25px;border-bottom:1px solid var(--rule);padding:18px 0;font-size:13px}
.backdrop-nav{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:18px;background:var(--control)}
.veil{position:absolute;inset:42px 0 18px;background:#30303099;z-index:-1;pointer-events:none}
.about-sheet{position:relative;border-radius:18px;overflow:hidden;background:var(--paper);color:var(--ink)}
.reading-body{position:relative;scroll-behavior:smooth}.phone[data-view=window]{height:884px;min-height:0}
.phone[data-view=window] .about-sheet{height:100%;display:flex;flex-direction:column}
.phone[data-view=window] .reading-body{overflow:auto;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:var(--outline) transparent}
.close-about{position:absolute;z-index:5;right:5px;top:5px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--ink)}
.close-about .icon{width:17px;height:17px}.close-about:hover{background:var(--hover)}
.eyebrow{font-size:calc(10px * var(--text-scale));font-weight:550;letter-spacing:.14em;line-height:1.6}
.product-name{margin:0;font-size:calc(clamp(27px,2.5vw,39px) * var(--text-scale));letter-spacing:-.035em;line-height:1.2;font-weight:650}
.tagline{font-size:calc(12px * var(--text-scale));line-height:1.8;margin:0}
.disclaimer{font-size:calc(11px * var(--text-scale));line-height:1.7;margin:4px 0 0;color:var(--muted)}
.version{font-size:calc(10px * var(--text-scale));font-variant-numeric:tabular-nums;letter-spacing:.06em}
.logo{display:block;width:58px;aspect-ratio:48.497475/56;flex-shrink:0;color:inherit}.logo svg{width:100%;height:100%}
.logo svg path{fill:currentColor!important;fill-opacity:1!important;stroke:none!important}
.watermark{position:absolute;pointer-events:none;opacity:.11;transform:rotate(-8deg)}
.watermark .logo{width:100%}
.link-row{display:flex;text-decoration:none;align-items:center;gap:12px;min-height:64px}
.link-text{flex:1;min-width:0}.link-title{display:block;font-size:calc(16px * var(--text-scale));font-weight:600;line-height:1.5}
.link-caption{display:block;font-size:calc(10px * var(--text-scale));line-height:1.7;color:var(--muted);margin-top:2px}
.link-row .icon{flex-shrink:0;transition:transform .18s}.link-row:hover .icon{transform:translateX(4px)}
.index{font-family:Georgia,serif;font-style:italic;font-size:calc(23px * var(--text-scale));font-weight:400;line-height:1.2}
.info-heading{font-size:calc(17px * var(--text-scale));font-weight:600;line-height:1.5;margin:0 0 9px}
.paragraphs{margin:0;padding:0;list-style:none;font-size:calc(12px * var(--text-scale));line-height:1.95;color:var(--muted)}
.paragraphs li{position:relative;padding-left:12px;margin-top:7px}.paragraphs li:first-child{margin-top:0}
.paragraphs li:before{content:"";position:absolute;left:0;top:.84em;width:3px;height:3px;border-radius:50%;background:currentColor}
.author-kicker{font-size:calc(10px * var(--text-scale));letter-spacing:.08em}.author-name{font-size:calc(14px * var(--text-scale));line-height:1.6;font-weight:650}
.shortcut{display:flex;gap:16px;flex-wrap:wrap;font-size:calc(10px * var(--text-scale));color:inherit}
.shortcut a{text-decoration:none;border-bottom:1px solid currentColor;text-underline-offset:4px;opacity:.85;transition:opacity .18s}.shortcut a:hover{opacity:1}
.reopen{position:absolute;inset:100px 18px 45px;z-index:6;display:grid;align-content:center;justify-items:center;gap:18px;color:var(--ink);background:var(--paper);border-radius:18px;text-align:center;padding:30px}
.reopen h3{font-size:20px;margin:0}.reopen p{font-size:12px;line-height:1.9;margin:0;color:var(--muted)}
.reopen button{font-size:13px;min-height:44px;border-bottom:1px solid var(--outline);padding:8px 4px}
.design-note{font-size:11px;line-height:1.8;color:var(--page-muted);margin:12px 0 0}
.page-foot{margin-top:30px;padding-top:18px;padding-bottom:28px;border-top:1px solid var(--page-rule);font-size:11px;color:var(--page-muted);display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}
.page-foot a{color:inherit;text-underline-offset:4px}
/* A — folio: a dark title page and a quiet indexed colophon. */
.a-cover{position:relative;overflow:hidden;background:var(--strong);color:var(--on-strong);padding:26px 25px 24px;min-height:240px}
.a-cover .eyebrow{padding-right:30px}.a-cover .product-name{position:relative;margin:32px 0 18px}
.a-cover .version{position:relative;display:block;margin-bottom:14px}.a-cover .watermark{width:133px;right:-15px;bottom:7px}
.a-cover .shortcut{position:relative}.design-a .close-about{color:var(--on-strong);background:var(--strong)}.design-a .close-about:hover{background:var(--cover-hover)}
.a-description{padding:20px 25px 22px;background:var(--control);border-bottom:1px solid var(--rule)}
.a-links{padding:4px 25px 0}.a-links .link-row{padding:13px 0;border-bottom:1px solid var(--rule)}
.a-links .index{width:32px;color:var(--muted)}.a-links .link-row .icon{width:21px}
.a-info{display:grid;grid-template-columns:32px 1fr;gap:12px;padding:24px 25px;border-bottom:1px solid var(--rule)}
.a-info .index{color:var(--muted);padding-top:3px}.a-info.local-info{background:var(--low)}
.a-author{padding:23px 25px 26px;background:var(--paper);display:flex;gap:16px;justify-content:space-between;align-items:flex-end}
.a-author .author-kicker{color:var(--muted);display:block;margin-bottom:4px}.a-author .folio-end{font:italic 31px/1 Georgia,serif;color:var(--outline)}
/* B — continuous color planes: two links share one spread; reading has two generous bands. */
.b-cover{padding:26px 25px 24px;background:var(--paper);position:relative}
.b-cover .eyebrow{color:var(--muted);padding-right:30px}.b-brand{display:flex;align-items:center;gap:13px;margin:30px 0 24px}
.b-brand .logo{width:42px;color:var(--ink)}.b-brand .product-name{font-size:calc(clamp(25px,2.2vw,34px) * var(--text-scale))}
.b-brand .version{display:block;margin-top:8px;color:var(--muted)}.b-cover .tagline{padding-top:20px;border-top:1px solid var(--rule)}
.b-links{display:grid;grid-template-columns:1fr 1fr}.b-link{padding:20px 22px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:24px;min-height:163px;text-decoration:none}
.b-link:first-child{background:var(--control);color:var(--ink)}.b-link:last-child{background:var(--accent);color:var(--on-accent)}
.b-link .topline{display:flex;justify-content:space-between;align-items:center;width:100%}.b-link .index{font-size:32px}
.b-link .icon{transition:transform .18s;width:21px;height:21px}.b-link:hover .icon{transform:translateX(4px)}
.b-link .link-caption{color:inherit}.b-link .link-title{font-size:calc(15px * var(--text-scale))}
.b-info{padding:25px 25px 28px;position:relative;overflow:hidden;background:var(--low)}
.b-info .info-heading{margin-top:20px;font-size:calc(21px * var(--text-scale));position:relative}
.b-info .index{display:block;color:var(--muted);font-size:calc(33px * var(--text-scale))}
.b-info .section-label{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted)}
.b-info.local-info{background:var(--strong);color:var(--on-strong)}.b-info.local-info .paragraphs,.b-info.local-info .index,.b-info.local-info .section-label{color:var(--on-strong)}
.b-info.local-info .section-label{opacity:.85}.b-info.local-info .paragraphs{opacity:.94}
.b-info.local-info .paragraphs li{margin-top:12px}.b-info.local-info .paragraphs li:first-child{margin-top:0}
.b-author{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:24px 25px;background:var(--control)}
.b-author .author-kicker{display:block;color:var(--muted);margin-bottom:5px}.b-author .logo{width:32px;color:var(--ink)}
/* C — one continuous route, measured against variable-height reading sections. */
.c-cover{position:relative;overflow:hidden;padding:26px 25px 22px;background:var(--control)}
.c-cover .eyebrow{color:var(--muted);padding-right:30px}.c-brand{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:30px 0 20px}
.c-brand .logo{width:45px;color:var(--ink)}.c-brand .version{display:block;margin-top:9px;color:var(--muted)}
.c-cover .shortcut{margin-top:20px;color:var(--ink);padding-top:15px;border-top:1px solid var(--outline)}
.route-stack{position:relative;background:var(--paper)}.route-ribbon{position:absolute;inset:0 auto 0 0;width:66px;background:var(--low)}
.route-line{position:absolute;left:0;top:0;width:66px;height:100%;fill:none;stroke:var(--outline);stroke-width:1;pointer-events:none}
.route-section{position:relative;display:grid;grid-template-columns:66px 1fr;padding-right:22px;gap:13px}
.route-section:not(:last-child):after{content:"";position:absolute;bottom:0;left:79px;right:22px;border-bottom:1px solid var(--rule)}
.route-point{width:33px;height:33px;border-radius:50%;border:1px solid var(--outline);background:var(--low);color:var(--ink);display:grid;place-items:center;justify-self:center;align-self:start;margin-top:23px;z-index:1;font:italic 18px/1 Georgia,serif;transform:translateX(var(--node-offset))}
.route-point[data-node="1"]{background:var(--accent);color:var(--on-accent);border-color:var(--on-accent)}
.route-section .link-row{padding:21px 0;min-height:95px}.route-section .link-row .icon{width:21px;height:21px}
.route-info{padding:23px 0 25px}.route-info .info-heading{font-size:calc(17px * var(--text-scale))}
.route-info .paragraphs{font-size:calc(12px * var(--text-scale));line-height:1.95}
.c-author{position:relative;overflow:hidden;padding:25px;background:var(--strong);color:var(--on-strong)}
.c-author .author-kicker{display:block;margin-bottom:8px}.c-author .author-name{position:relative;display:block;padding-right:28px}
.c-author .signature{position:absolute;right:12px;bottom:-12px;font:italic 84px/1 Georgia,serif;opacity:.12;pointer-events:none}
@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:1190px){.page-head,main,.page-foot{padding-left:23px;padding-right:23px}.gallery{gap:19px}.phone{padding-left:9px;padding-right:9px}.design-label small{display:none}.a-cover,.a-description,.b-cover,.c-cover{padding-left:21px;padding-right:21px}.a-info{padding-left:20px;padding-right:20px;gap:9px}.a-links{padding-left:21px;padding-right:21px}.b-link{padding-left:19px;padding-right:19px}.b-info{padding-left:21px;padding-right:21px}.b-brand{gap:10px}.b-brand .logo{width:35px}}
@media(max-width:960px){.gallery{grid-template-columns:minmax(0,420px);justify-content:center;gap:34px}.product-name{font-size:calc(38px * var(--text-scale))}.b-brand .product-name{font-size:calc(32px * var(--text-scale))}.design-label small{display:block}.phone{min-height:0}.a-cover{min-height:242px}.page-head{padding-top:23px}}
@media(max-width:480px){.page-head,main,.page-foot{padding-left:16px;padding-right:16px}.brand{font-size:27px}.document-name{font-size:9px}h1{font-size:22px;margin-top:22px}.control-group{width:100%;gap:12px}.controls{gap:10px}.segments button{padding-left:9px;padding-right:9px}.control-group label{font-size:10px}.intro{font-size:11px}.gallery{gap:30px}.product-name{font-size:calc(34px * var(--text-scale))}.b-brand .product-name{font-size:calc(29px * var(--text-scale))}.b-brand .logo{width:34px}.b-cover,.a-cover,.a-description,.c-cover{padding-left:21px;padding-right:21px}.design-label small{font-size:9px}.page-foot{gap:6px;flex-direction:column}}
@media(max-width:360px){.page-head,main,.page-foot{padding-left:12px;padding-right:12px}.phone{padding-left:7px;padding-right:7px}.product-name{font-size:calc(29px * var(--text-scale))}.b-brand .product-name{font-size:calc(25px * var(--text-scale))}.b-brand{gap:9px}.b-brand .logo{width:28px}.c-brand .logo{width:32px}.a-cover,.b-cover,.c-cover{padding-left:18px;padding-right:18px}.a-info{grid-template-columns:27px 1fr;gap:8px;padding-left:18px;padding-right:18px}.a-links,.a-description{padding-left:18px;padding-right:18px}.b-info{padding-left:19px;padding-right:19px}.b-link{padding-left:17px;padding-right:17px}.route-ribbon,.route-line{width:60px}.route-section{grid-template-columns:60px 1fr;gap:10px;padding-right:17px}.route-section:not(:last-child):after{left:70px;right:17px}.a-author,.b-author,.c-author{padding-left:20px;padding-right:20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
'use strict';
const THEMES=JSON.parse(document.getElementById('theme-data').textContent);
const VERSION='1.40.18';
const PROJECT='https://github.com/Tale2229/YOURoom';
const FEEDBACK=PROJECT+'/issues';
const DESCRIPTION='北邮空闲教室查询与自习规划';
const DISCLAIMER='非学校官方应用';
const AUTHOR='23级 软工 小嚎猪';
const DATA=['空闲信息来自学校课表，并非实时空座','教室开放情况请以现场为准'];
const LOCAL=['教室标记与设置保存在设备上，可能参与系统备份','退出登录清除登录状态，保留已记住的账号密码、教室标记与设置','清除缓存需联网校验当前账号；清除全部本地数据后应用关闭，指引状态也会重置'];
const DESIGNS=[
 {id:'a',title:'扉页档案',hint:'深扉页 / 细编号 / 浅正文',note:'最贴近指引目录的扉页风格。链接与说明按编号排开，阅读清楚、安静。'},
 {id:'b',title:'分色编目',hint:'连续色面 / 两栏入口 / 深浅对照',note:'品牌区更明亮，链接并列；数据与本地说明各有一个完整色面，分区最鲜明。'},
 {id:'c',title:'路径手记',hint:'曲线串联 / 错落节点 / 落款',note:'沿用目录的平滑路径，把入口与两组说明串成一页；深色落款收束页面。'}
];
const logo=()=>'<span class="logo" aria-hidden="true">'+document.getElementById('brand-logo').innerHTML+'</span>';
const icon=name=>'<svg class="icon" aria-hidden="true"><use href="#'+name+'"/></svg>';
const paragraphs=items=>'<ul class="paragraphs">'+items.map(text=>'<li>'+text+'</li>').join('')+'</ul>';
const detail=(heading,items)=>'<h3 class="info-heading">'+heading+'</h3>'+paragraphs(items);
const version=()=>'<span class="version">VERSION '+VERSION+'</span>';
const description=()=>'<p class="tagline">'+DESCRIPTION+'</p><p class="disclaimer">'+DISCLAIMER+'</p>';
const shortcut=id=>'<nav class="shortcut" aria-label="页内阅读"><a href="#'+id+'-data" data-jump="data">数据与使用</a><a href="#'+id+'-local" data-jump="local">本地与登录</a></nav>';
const external=(type,inside,className)=>'<a class="'+className+'" href="'+(type==='project'?PROJECT:FEEDBACK)+'" target="_blank" rel="noopener noreferrer" aria-label="'+(type==='project'?'GitHub 项目':'问题反馈')+'，在新标签页打开">'+inside+'</a>';
const linkInside=(title,caption)=>'<span class="link-text"><span class="link-title">'+title+'</span><span class="link-caption">'+caption+'</span></span>'+icon('arrow');
function renderA(){return '<header class="a-cover"><div class="eyebrow">YOURoom / ABOUT</div><span class="watermark" aria-hidden="true">'+logo()+'</span><h2 class="product-name">YOURoom</h2>'+version()+shortcut('a')+'</header><div class="a-description">'+description()+'</div><div class="a-links">'+external('project','<span class="index" aria-hidden="true">01</span>'+linkInside('GitHub','Tale2229 / YOURoom'),'link-row')+external('feedback','<span class="index" aria-hidden="true">02</span>'+linkInside('问题反馈','Issues / 问题与建议'),'link-row')+'</div><section class="a-info" id="a-data" data-section="data"><span class="index" aria-hidden="true">03</span><div>'+detail('数据与使用',DATA)+'</div></section><section class="a-info local-info" id="a-local" data-section="local"><span class="index" aria-hidden="true">04</span><div>'+detail('本地与登录',LOCAL)+'</div></section><footer class="a-author"><div><span class="author-kicker">开发者</span><span class="author-name">'+AUTHOR+'</span></div><span class="folio-end" aria-hidden="true">Y.</span></footer>';}
function renderB(){return '<header class="b-cover"><div class="eyebrow">YOURoom / ABOUT</div><div class="b-brand">'+logo()+'<div><h2 class="product-name">YOURoom</h2>'+version()+'</div></div>'+description()+'</header><div class="b-links">'+external('project','<span class="topline"><span class="index" aria-hidden="true">01</span>'+icon('arrow')+'</span><span><span class="link-title">GitHub</span><span class="link-caption">项目代码库</span></span>','b-link')+external('feedback','<span class="topline"><span class="index" aria-hidden="true">02</span>'+icon('arrow')+'</span><span><span class="link-title">问题反馈</span><span class="link-caption">Issues / 问题与建议</span></span>','b-link')+'</div><section class="b-info" id="b-data" data-section="data"><div class="section-label"><span class="index" aria-hidden="true">03</span><span class="eyebrow">DATA & USE</span></div>'+detail('数据与使用',DATA)+'</section><section class="b-info local-info" id="b-local" data-section="local"><div class="section-label"><span class="index" aria-hidden="true">04</span><span class="eyebrow">LOCAL & LOGIN</span></div>'+detail('本地与登录',LOCAL)+'</section><footer class="b-author"><div><span class="author-kicker">开发者</span><span class="author-name">'+AUTHOR+'</span></div>'+logo()+'</footer>';}
function renderC(){
const point=n=>'<span class="route-point" data-node="'+n+'" style="--node-offset:'+(n%2===1?'-10px':'10px')+'" aria-hidden="true">0'+n+'</span>';
return '<header class="c-cover"><div class="eyebrow">YOURoom / ABOUT</div><div class="c-brand"><div><h2 class="product-name">YOURoom</h2>'+version()+'</div>'+logo()+'</div>'+description()+shortcut('c')+'</header><div class="route-stack"><div class="route-ribbon" aria-hidden="true"></div><svg class="route-line" aria-hidden="true"><path/></svg><div class="route-section">'+point(1)+external('project',linkInside('GitHub','项目代码库'),'link-row')+'</div><div class="route-section">'+point(2)+external('feedback',linkInside('问题反馈','Issues / 问题与建议'),'link-row')+'</div><section class="route-section" id="c-data" data-section="data">'+point(3)+'<div class="route-info">'+detail('数据与使用',DATA)+'</div></section><section class="route-section" id="c-local" data-section="local">'+point(4)+'<div class="route-info">'+detail('本地与登录',LOCAL)+'</div></section></div><footer class="c-author"><span class="signature" aria-hidden="true">23</span><span class="author-kicker">开发者 / CREATED BY</span><span class="author-name">'+AUTHOR+'</span></footer>';
}
function backdrop(){return '<div class="status" aria-hidden="true"><span>9:41</span><svg viewBox="0 0 43 10"><path d="M1 8h2V6H1zm4 0h2V4H5zm4 0h2V2H9zm4 0h2V0h-2zM20 1h17v8H20zm18 2h3v4h-3z"/></svg></div><div class="settings-backdrop" aria-hidden="true"><div class="backdrop-name">设置</div><div class="backdrop-line">深色模式</div><div class="backdrop-line">时段条样式</div><div class="backdrop-line">规划偏好</div><div class="backdrop-line">使用指引</div><div class="backdrop-line">关于</div><div class="backdrop-nav">'+icon('building')+icon('route')+icon('settings')+'</div></div><div class="veil" aria-hidden="true"></div><div class="home" aria-hidden="true"></div>';}
document.getElementById('gallery').innerHTML=DESIGNS.map((d,index)=>'<article class="study" data-design="'+d.id+'" style="--order:'+index+'"><div class="design-label"><span class="design-letter">'+d.id.toUpperCase()+'</span><h2>'+d.title+'</h2><small>'+d.hint+'</small></div><div class="phone design-'+d.id+'" data-view="full">'+backdrop()+'<section class="about-sheet" aria-label="'+d.title+'：关于 YOURoom"><button class="close-about" aria-label="关闭关于预览">'+icon('close')+'</button><div class="reading-body">'+[renderA,renderB,renderC][index]()+'</div></section><div class="reopen" hidden><h3>已关闭关于预览</h3><p>只关闭这一版演示，不影响其他方案或正式应用</p><button>重新打开关于</button></div></div><p class="design-note">'+d.note+'</p></article>').join('');
let selectedTheme='MATISSE',mode='light',view='full',textScale=1;
const select=document.getElementById('theme-select');
select.innerHTML=THEMES.map(t=>'<option value="'+t.id+'">'+t.name+'</option>').join('');
select.value=selectedTheme;
function rgb(hex){return hex.slice(1).match(/../g).map(v=>parseInt(v,16));}
function mix(a,b,t){return '#'+rgb(a).map((v,i)=>Math.round(v*(1-t)+rgb(b)[i]*t).toString(16).padStart(2,'0')).join('');}
function luminance(hex){const c=rgb(hex).map(v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*c[0]+.7152*c[1]+.0722*c[2];}
function contrast(a,b){const x=luminance(a),y=luminance(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
function readable(bg,...options){return [...options,'#FFFFFF','#171A18'].sort((a,b)=>contrast(bg,b)-contrast(bg,a))[0];}
function palette(t,m){
 const n=t[m],strong=m==='dark'?mix(n.header,n.lowest,.2):t.badge;
 const muted=[n.paper,n.control,n.low].every(bg=>contrast(bg,n.muted)>=4.5)?n.muted:n.ink;
 return {paper:n.paper,ink:n.ink,muted,rule:n.rule,outline:n.outline,low:n.low,control:n.control,
 strong,'on-strong':readable(strong,n.paper,n.ink),accent:n.accent,'on-accent':readable(n.accent,n.onAccent,n.ink),
 hover:mix(n.paper,n.ink,.08),'cover-hover':mix(strong,readable(strong,n.paper,n.ink),.1)};
}
function updateStatus(message){document.getElementById('preview-status').textContent=message||THEMES.find(t=>t.id===selectedTheme).name+' · '+(mode==='dark'?'深色':'浅色')+' · '+(view==='full'?'完整展开':'手机窗口')+'；预览不保存任何设置。';}
function update(){
 document.documentElement.dataset.mode=mode;
 document.documentElement.style.setProperty('--text-scale',textScale);
 select.value=selectedTheme;
 document.getElementById('text-scale').value=String(textScale);
 const p=palette(THEMES.find(t=>t.id===selectedTheme),mode);
 for(const phone of document.querySelectorAll('.phone')){for(const [key,value]of Object.entries(p))phone.style.setProperty('--'+key,value);phone.dataset.view=view;}
 for(const b of document.querySelectorAll('[data-mode]'))if(b.tagName==='BUTTON')b.setAttribute('aria-pressed',String(b.dataset.mode===mode));
 for(const b of document.querySelectorAll('button[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===view));
 updateStatus();requestAnimationFrame(drawRoutes);
}
function drawRoutes(){
 for(const stack of document.querySelectorAll('.route-stack')){
  if(!stack.getBoundingClientRect().width)continue;
  const rect=stack.getBoundingClientRect(),svg=stack.querySelector('.route-line'),line=svg.querySelector('path');
  const nodes=[...stack.querySelectorAll('.route-point')].map(el=>{const r=el.getBoundingClientRect();return {x:r.left+r.width/2-rect.left,y:r.top+r.height/2-rect.top};});
  const width=parseFloat(getComputedStyle(svg).width);svg.setAttribute('viewBox','0 0 '+width+' '+rect.height);
  let path='M'+nodes[0].x+' 0V'+nodes[0].y;
  nodes.slice(1).forEach((n,i)=>{const a=nodes[i],mid=(a.y+n.y)/2;path+='C'+a.x+' '+mid+' '+n.x+' '+mid+' '+n.x+' '+n.y;});
  path+='V'+rect.height;line.setAttribute('d',path);
 }
}
select.onchange=()=>{selectedTheme=select.value;update();};
document.getElementById('text-scale').onchange=e=>{textScale=Number(e.target.value);update();};
document.getElementById('design-select').onchange=e=>{for(const study of document.querySelectorAll('.study'))study.hidden=e.target.value!=='all'&&study.dataset.design!==e.target.value;document.getElementById('gallery').style.gridTemplateColumns=e.target.value==='all'?'':'minmax(0,420px)';document.getElementById('gallery').style.justifyContent=e.target.value==='all'?'':'center';requestAnimationFrame(drawRoutes);};
document.querySelectorAll('button[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;update();});
document.querySelectorAll('button[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;update();});
document.querySelectorAll('.study').forEach(study=>{
 const sheet=study.querySelector('.about-sheet'),reopen=study.querySelector('.reopen');
 study.querySelector('.close-about').onclick=()=>{sheet.hidden=true;reopen.hidden=false;updateStatus(study.querySelector('h2').textContent+' · 已关闭预览');reopen.querySelector('button').focus({preventScroll:true});};
 reopen.querySelector('button').onclick=()=>{sheet.hidden=false;reopen.hidden=true;requestAnimationFrame(drawRoutes);study.querySelector('.close-about').focus({preventScroll:true});updateStatus();};
 study.querySelectorAll('[data-jump]').forEach(link=>link.onclick=e=>{e.preventDefault();const target=study.querySelector('[data-section="'+link.dataset.jump+'"]');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const reading=study.querySelector('.reading-body');if(view==='window'){reading.scrollTo({top:target.offsetTop,behavior:reduced?'instant':'smooth'});}else target.scrollIntoView({behavior:reduced?'instant':'smooth',block:'center'});});
 study.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden){e.preventDefault();study.querySelector('.close-about').click();}});
});
const resizeObserver=new ResizeObserver(drawRoutes);
document.querySelectorAll('.route-stack,.route-point').forEach(el=>resizeObserver.observe(el));
window.addEventListener('resize',drawRoutes);
update();
</script>
</body>
</html>
