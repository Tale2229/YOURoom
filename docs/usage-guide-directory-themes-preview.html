<title>YOURoom · 扉页 × 路径目录 · 12 主题</title>
<style>
/* Visual thesis: the A folio cover and light footer, joined by C's continuous chapter route.
   Content plan: theme / mode controls → twelve identically composed native-color studies → chapter inspection.
   Interaction thesis: quiet gallery entrance, directional hover feedback, a short chapter-detail reveal.
   Native palettes: Theme.kt + ThemeRoles.kt, frozen at the ab1825f checkpoint, 2026-10-23.
   This is an offline, in-memory prototype. No app files, preferences or guide history are changed. */
:root{color-scheme:light;--canvas:#f4f3ef;--page-ink:#313a38;--page-muted:#68716c;--page-rule:#d9ddd5}
:root[data-appearance=dark]{color-scheme:dark;--canvas:#191e1c;--page-ink:#e5e9df;--page-muted:#aab5ac;--page-rule:#3c4740}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--page-ink);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}
button,select{font:inherit;color:inherit}button{padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible{outline:2px solid currentColor;outline-offset:4px}button:disabled{cursor:default}
[hidden]{display:none!important}svg{display:block}.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sprite{position:absolute;width:0;height:0;overflow:hidden}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.page-head,main,.page-foot{width:min(1320px,100%);margin:auto;padding-left:32px;padding-right:32px}
.page-head{padding-top:32px;padding-bottom:24px}.identity{display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{font-size:30px;letter-spacing:-1px;font-weight:750;line-height:1.2}.document-name{font-size:12px;color:var(--page-muted)}

.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--page-rule);border-bottom:1px solid var(--page-rule);padding:15px 0;margin-top:24px}
.control-group{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.control-group label{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--page-muted)}
select{max-width:150px;min-height:38px;padding:5px 28px 5px 10px;border:1px solid var(--page-rule);border-radius:5px;background:var(--canvas);font-size:12px;color:var(--page-ink)}

.theme-key{display:flex;align-items:center;gap:7px;color:var(--page-muted);font-size:10px;margin-top:15px}.theme-key i{width:14px;height:14px;border:1px solid #8883;display:block}
.theme-key span{margin-left:7px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding-top:8px;padding-bottom:26px;align-items:start}
.gallery[data-view=single]{grid-template-columns:minmax(0,420px);justify-content:center}.design{min-width:0;animation:arrive .42s ease-out both;animation-delay:calc(var(--order)*70ms)}
.design-label{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}.design-letter{font:italic 34px/1 Georgia,serif}

.phone{height:824px;position:relative;isolation:isolate;overflow:hidden;border:1px solid var(--page-rule);border-radius:26px;background:var(--paper);color:var(--ink)}
.phone[data-mode=light]{color-scheme:light}.phone[data-mode=dark]{color-scheme:dark}.status{height:27px;padding:7px 19px 0;display:flex;align-items:center;justify-content:space-between;font-size:9px;line-height:12px;background:var(--header);color:var(--on-header)}
.status svg{width:41px;height:10px;fill:currentColor}.stage{position:absolute;inset:27px 0 17px;isolation:isolate}.home-line{position:absolute;bottom:7px;left:calc(50% - 42px);width:84px;height:3px;border-radius:3px;background:var(--ink)}
.underlay{height:100%;padding:24px 23px;pointer-events:none}.underlay-head{display:flex;justify-content:space-between;align-items:center;font-size:27px;font-weight:700}
.underlay-head small{font-size:11px;font-weight:400}.underlay-grid{height:68px;margin:30px 0;background:repeating-linear-gradient(90deg,var(--control) 0,var(--control) 17px,transparent 17px,transparent 22px);opacity:.65}
.underlay-rule{border-top:1px solid var(--rule);padding:16px 0;display:flex;justify-content:space-between;font-size:12px}
.underlay-nav{position:absolute;bottom:0;left:0;right:0;height:54px;background:var(--strong);color:var(--on-strong);display:flex;align-items:center;justify-content:space-around}
.veil{position:absolute;inset:0;background:#30303099;pointer-events:none}.directory{position:absolute;inset:72px 12px 22px;border-radius:16px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column;color:var(--ink)}
.directory button{touch-action:manipulation}.close-menu,.close-detail{position:absolute;right:12px;top:10px;width:44px;height:44px;display:grid;place-items:center;z-index:2}
.close-menu .icon,.close-detail .icon{width:17px;height:17px}.eyebrow{font-size:10px;letter-spacing:.13em;line-height:1.5;font-weight:500}
.subline{font-size:11px;line-height:1.5;margin:8px 0 0}.menu-footer{padding:17px 22px 16px;background:var(--control);color:var(--ink);margin-top:auto}
.footer-meta{display:flex;justify-content:space-between;align-items:center;font-size:10px;margin-bottom:12px;gap:8px}.footer-meta button{font-size:10px;min-height:25px;text-underline-offset:4px;text-decoration:underline}
.start-guide{min-height:44px;display:flex;align-items:center;justify-content:space-between;width:100%;font-size:13px;font-weight:600}
.start-guide .icon{width:21px;height:21px;transition:transform .18s}.start-guide:hover .icon{transform:translateX(4px)}.menu-footer .start-guide{border-top:1px solid var(--rule);padding-top:10px}
.chapter-button{position:relative;text-align:left;transition:background-color .18s,color .18s}.chapter-button .chapter-title{display:block;font-weight:600;line-height:1.4}
.chapter-button .chapter-copy{display:block;font-size:10px;line-height:1.6;margin-top:5px}.chapter-button .row-arrow{width:17px;height:17px;transition:transform .18s}.chapter-button:hover .row-arrow{transform:translateX(3px)}

.folio-head{height:209px;flex-shrink:0;padding:24px;background:var(--strong);color:var(--on-strong);position:relative;overflow:hidden}
.folio-head .close-menu{color:var(--on-strong)}.folio-head h3{font-size:43px;line-height:1.14;letter-spacing:.03em;font-weight:500;margin:20px 0 0}
.folio-head .subline{font-size:10px;letter-spacing:.06em;margin-top:11px}.folio-number{position:absolute;right:16px;bottom:-26px;font:italic 132px/1 Georgia,serif;opacity:.13;pointer-events:none}
.folio-body{display:grid;grid-template-columns:35px 1fr;flex:1;min-height:0}.folio-spine{background:var(--control);color:var(--muted);writing-mode:vertical-rl;display:flex;align-items:center;justify-content:space-between;padding:20px 0;font-size:9px;letter-spacing:.18em}
.folio-list{display:grid;grid-template-rows:repeat(4,1fr);min-height:0}.folio-row{display:grid;grid-template-columns:33px 1fr 18px;align-items:center;gap:9px;padding:12px 18px 12px 14px;min-height:75px}
.folio-row:not(:last-child):after{content:"";position:absolute;left:56px;right:19px;bottom:0;height:1px;background:var(--rule)}
.folio-row .index{font:italic 28px/1 Georgia,serif;color:var(--muted)}.folio-row .chapter-title{font-size:16px}
.folio-row .chapter-copy{font-size:10px;color:var(--muted)}.folio-row.current{background:var(--accent-tint)}.folio-row.current .index{color:var(--ink)}

.row-range{display:block;font-size:9px;line-height:1.6;letter-spacing:.03em;color:var(--muted);margin-top:4px}.current .row-range:after{content:" · 当前章节";color:var(--ink)}
.folio .menu-footer{padding-left:24px;background:var(--paper);border-top:1px solid var(--rule)}
/* B: four continuous chapter planes. No floating cards, rounded tiles or dashboard badges. */
.color-head{padding:25px 24px 22px;background:var(--paper);height:151px;flex-shrink:0;position:relative}
.color-head h3{font-size:32px;line-height:1.15;letter-spacing:.01em;font-weight:500;margin:20px 0 7px}
.color-head .subline{font-size:10px;margin:0;color:var(--muted)}.color-head .close-menu{color:var(--ink)}
.color-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.04fr .96fr}
.color-tile{padding:20px 21px 18px;display:flex;flex-direction:column;justify-content:space-between;min-height:173px;overflow:hidden}
.color-tile:nth-child(1){background:var(--plane-1);color:var(--on-plane-1)}.color-tile:nth-child(2){background:var(--control);color:var(--ink)}
.color-tile:nth-child(3){background:var(--accent);color:var(--on-accent)}.color-tile:nth-child(4){background:var(--high);color:var(--ink)}
.tile-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}.tile-index{font:normal 51px/.9 Georgia,serif;letter-spacing:-2px}
.tile-mark{height:14px;width:14px;border:1px solid currentColor;border-radius:50%;margin-top:2px;position:relative}.current .tile-mark:after{content:"";position:absolute;inset:3px;border-radius:50%;background:currentColor}
.color-tile .chapter-title{font-size:17px;margin-top:16px}.color-tile .chapter-copy{font-size:10px;line-height:1.6;max-width:110px;min-height:32px}
.tile-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:9px}.tile-bottom .icon{width:16px;height:16px;transition:transform .18s}
.color-tile:hover .tile-bottom .icon{transform:translate(3px,-3px)}.color-tile:active{filter:brightness(.96)}
.color-footer{background:var(--paper);padding-top:15px}.color-footer .start-guide{border-color:var(--rule)}
/* C: an itinerary. A quiet side plane and one continuous route connect, rather than box, the chapters. */
.route-head{background:var(--control);padding:25px 24px 22px;position:relative;height:179px;flex-shrink:0}
.route-head .close-menu{color:var(--ink)}.route-head h3{font-size:35px;line-height:1.2;font-weight:500;letter-spacing:.03em;margin:26px 0 6px}
.route-head .subline{font-size:10px;color:var(--muted);margin:0}.route-head:after{content:"";position:absolute;height:3px;width:34px;left:24px;bottom:0;background:var(--strong)}
.route-list{position:relative;display:grid;grid-template-rows:repeat(4,1fr);flex:1;min-height:0}

.route-row{display:grid;grid-template-columns:83px 1fr 20px;align-items:center;gap:12px;padding-right:23px;min-height:82px}
.route-node{justify-self:center;display:grid;place-items:center;width:35px;height:35px;border:1px solid var(--outline);background:var(--low);color:var(--ink);border-radius:50%;font:italic 20px/1 Georgia,serif;z-index:1;transition:transform .18s}
.route-row:nth-of-type(odd) .route-node{transform:translateX(-13px)}.route-row:nth-of-type(even) .route-node{transform:translateX(13px)}
.route-row .chapter-title{font-size:17px}.route-row .chapter-copy{color:var(--muted);font-size:10px;max-width:180px}
.route-row .row-range{margin-top:3px}.route-row.current .route-node{background:var(--accent);color:var(--on-accent);border-color:var(--on-accent)}
.route-row:hover .row-arrow{transform:translateX(3px)}.route-row:after{content:"";position:absolute;right:24px;left:107px;bottom:0;height:1px;background:var(--rule)}.route-row:last-child:after{display:none}
.route-footer{background:var(--strong);color:var(--on-strong);padding:17px 24px 18px}.route-footer .start-guide{border-color:color-mix(in srgb,var(--on-strong) 25%,transparent)}

.detail-head{position:relative;padding:24px 24px 21px;background:var(--control);flex-shrink:0}.detail-head h3{font-size:29px;line-height:1.3;font-weight:500;margin:14px 0 8px}

.step-list{margin:0;padding:7px 20px;list-style:none;overflow:auto;flex:1;min-height:0;scrollbar-width:thin}
.step-option{display:grid;grid-template-columns:30px 1fr 18px;align-items:center;gap:9px;text-align:left;width:100%;min-height:45px;padding:7px 8px;border-bottom:1px solid var(--rule);font-size:12px}
.step-option .step-index{font:italic 17px Georgia,serif;color:var(--muted)}.step-option .icon{width:15px;height:15px;opacity:0}
.step-option[aria-pressed=true]{background:var(--accent-tint)}.step-option[aria-pressed=true] .icon{opacity:1}.step-option:hover{background:var(--low)}
.detail-footer{padding:14px 24px 18px;border-top:1px solid var(--rule);background:var(--control);flex-shrink:0}.detail-footer p{font-size:10px;margin:0 0 4px;color:var(--muted)}
.preview-entry{position:absolute;inset:0;z-index:5;background:var(--paper);padding:36px 24px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
.preview-entry .index{font:italic 84px/1 Georgia,serif;color:var(--outline);margin-bottom:24px}.preview-entry h3{font-size:25px;line-height:1.4;margin:0 0 14px}
.preview-entry p{font-size:12px;line-height:1.9;color:var(--muted);margin:0 0 30px}.back-directory{display:flex;align-items:center;gap:18px;padding:12px 0;border-bottom:1px solid var(--outline);font-size:13px}
.menu-closed{position:absolute;inset:0;z-index:3;display:grid;align-content:center;justify-items:center;gap:15px;background:var(--paper);padding:30px;text-align:center}

.page-foot a{color:inherit;text-underline-offset:4px}.screen-reader-status{min-height:20px;font-size:11px;color:var(--page-muted);margin:0 0 8px}

@keyframes detail-in{from{opacity:.35;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}

.hybrid .route-list:before{content:"";position:absolute;left:24px;top:0;width:34px;height:3px;background:var(--strong);z-index:2;pointer-events:none}
.hybrid .menu-footer .start-guide{border-top:0;padding-top:0}

<header class="page-head">

<script>

let mode='light';
const themeFor=phone=>THEMES.find(t=>t.id===phone.dataset.theme);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=id=>'<svg class="icon" aria-hidden="true"><use href="#i-'+id+'"/></svg>';
const pad=n=>String(n).padStart(2,'0');
const range=ch=>pad(ch.start)+'—'+pad(ch.end);
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const luminance=h=>hexRgb(h).map(v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0);
const contrast=(a,b)=>(Math.max(luminance(a),luminance(b))+.05)/(Math.min(luminance(a),luminance(b))+.05);
function mix(a,b,p){return '#'+hexRgb(a).map((v,i)=>Math.round(v*(1-p)+hexRgb(b)[i]*p).toString(16).padStart(2,'0')).join('');}
function readable(bg,...options){return options.concat(['#FFFFFF','#171A18']).sort((a,b)=>contrast(bg,b)-contrast(bg,a))[0];}
function palette(t=THEMES[0],m=mode){
  const p=t[m];
  const strong=m==='dark'?mix(p.header,p.lowest,.2):t.badge;
  const onStrong=readable(strong,p.paper,p.ink);
  const plane1=contrast(p.header,p.paper)>=1.45?p.header:strong;
  return {paper:p.paper,ink:p.ink,muted:contrast(p.paper,p.muted)>=4.5?p.muted:p.ink,rule:p.rule,outline:p.outline,
    control:p.control,high:p.high,low:p.low,header:p.header,'on-header':p.onHeader,strong,'on-strong':onStrong,
    accent:p.accent,'on-accent':readable(p.accent,p.onAccent,p.ink),
    'accent-tint':mix(p.paper,p.accent,m==='dark'?.15:.22),'plane-1':plane1,'on-plane-1':readable(plane1,p.onHeader,p.ink)};
}
function setPalette(el,p){for(const [key,value] of Object.entries(p))el.style.setProperty('--'+key,value);}
function notify(message){document.getElementById('preview-status').textContent=message;}
function makeRows(type,current){
  const currentChapter=STEPS[current-1].chapter;
  return CHAPTERS.map((ch,index)=>{
    const selected=index===currentChapter;
    const classes='chapter-button '+(type==='a'?'folio-row':type==='b'?'color-tile':'route-row')+(selected?' current':'');
    let inside='';
    if(type==='a') inside='<span class="index" aria-hidden="true">'+pad(index+1)+'</span><span><span class="chapter-title">'+ch.title+'</span><span class="chapter-copy">'+ch.short+'</span><span class="row-range">'+range(ch)+' / '+(ch.end-ch.start+1)+' 小节</span></span>'+icon('arrow').replace('class="icon"','class="icon row-arrow"');
    if(type==='b') inside='<span class="tile-top"><span class="tile-index" aria-hidden="true">'+pad(index+1)+'</span><span class="tile-mark" aria-hidden="true"></span></span><span><span class="chapter-title">'+ch.title+'</span><span class="chapter-copy">'+ch.lines.join('<br>')+'</span><span class="tile-bottom"><span>'+range(ch)+' · '+(ch.end-ch.start+1)+' 小节</span>'+icon('north')+'</span></span>';
    if(type==='c') inside='<span class="route-node" aria-hidden="true">'+pad(index+1)+'</span><span><span class="chapter-title">'+ch.title+'</span><span class="chapter-copy">'+ch.copy+'</span><span class="row-range">第 '+ch.start+'—'+ch.end+' 步</span></span>'+icon('arrow').replace('class="icon"','class="icon row-arrow"');
    return '<button class="'+classes+'" data-chapter="'+index+'" aria-label="'+ch.title+'，第'+ch.start+'至'+ch.end+'步"'+(selected?' aria-current="step"':'')+'>'+inside+'</button>';
  }).join('');
}

  return '<footer class="menu-footer '+(type==='b'?'color-footer':type==='c'?'route-footer':'')+'"><button class="start-guide" data-action="continue"><span>'+(current===1?'开始使用指引':'继续第 '+current+' 步')+'</span>'+icon('arrow')+'</button></footer>';
}

}

function renderPhone(phone,current){

function openChapter(phone,index){
  const state=states.get(phone),chapter=CHAPTERS[index];
  const directory=phone.querySelector('.directory');
  state.chapter=index;
  state.selectedStep=STEPS[state.current-1].chapter===index?state.current:chapter.start;
  const rows=STEPS.filter(step=>step.chapter===index).map(step=>'<li><button class="step-option" data-step="'+step.step+'" aria-pressed="'+(step.step===state.selectedStep)+'"><span class="step-index">'+pad(step.step)+'</span><span>'+escapeHtml(step.title)+'</span>'+icon('check')+'</button></li>').join('');
  directory.insertAdjacentHTML('beforeend','<section class="chapter-drawer" aria-label="'+chapter.title+'的小节"><header class="detail-head"><button class="close-detail" data-action="back" aria-label="返回目录">'+icon('back')+'</button><div class="eyebrow">CHAPTER '+pad(index+1)+' / 04</div><h3>'+chapter.title+'</h3><p>第 '+chapter.start+'—'+chapter.end+' 步 · '+(chapter.end-chapter.start+1)+' 个小节</p></header><ol class="step-list">'+rows+'</ol><footer class="detail-footer"><button class="start-guide" data-action="enter"><span>进入第 '+state.selectedStep+' 步</span>'+icon('arrow')+'</button></footer></section>');
  directory.querySelector('.chapter-drawer .close-detail').focus({preventScroll:true});
  const list=directory.querySelector('.step-list'),selected=directory.querySelector('.step-option[aria-pressed=true]');
  list.scrollTop=Math.max(0,selected.getBoundingClientRect().top-list.getBoundingClientRect().top-12);
}
function enterStep(phone,step){
  const state=states.get(phone);state.current=step;state.selectedStep=step;
  const directory=phone.querySelector('.directory');
  directory.querySelector('.chapter-drawer')?.remove();
  directory.insertAdjacentHTML('beforeend','<section class="preview-entry" aria-label="所选指引入口预览"><span class="eyebrow">YOURoom / 入口预览</span><span class="index" aria-hidden="true">'+pad(step)+'</span><h3>'+escapeHtml(STEPS[step-1].title)+'</h3><p>已选择第 '+step+' 步 · '+CHAPTERS[STEPS[step-1].chapter].title+'<br>这里仅预览目录入口，不启动正式指引</p><button class="back-directory" data-action="reopen">返回目录 '+icon('arrow')+'</button></section>');
  directory.querySelector('.back-directory').focus({preventScroll:true});
  notify(themeFor(phone).name+'：已预览第 '+step+' 步入口，未更改应用或真实进度');
}
function restoreMenu(phone){
  const state=states.get(phone),type=phone.dataset.design;
  phone.querySelector('.directory')?.remove();
  phone.querySelector('.menu-closed')?.remove();
  phone.querySelector('.stage').insertAdjacentHTML('beforeend',menu(type,state.current));
  phone.querySelector('.close-menu').focus({preventScroll:true});
}
function handlePhone(phone,event){
  const button=event.target.closest('button');
  if(!button||!phone.contains(button))return;
  const state=states.get(phone);
  if(button.hasAttribute('data-chapter')){openChapter(phone,Number(button.dataset.chapter));return;}
  if(button.hasAttribute('data-step')){
    state.selectedStep=Number(button.dataset.step);
    phone.querySelectorAll('.step-option').forEach(row=>row.setAttribute('aria-pressed',String(Number(row.dataset.step)===state.selectedStep)));
    phone.querySelector('.detail-footer .start-guide span').textContent='进入第 '+state.selectedStep+' 步';return;
  }
  const action=button.dataset.action;
  if(action==='back'){
    phone.querySelector('.chapter-drawer').remove();
    phone.querySelector('[data-chapter="'+state.chapter+'"]').focus({preventScroll:true});
  }else if(action==='continue')enterStep(phone,state.current);
  else if(action==='enter')enterStep(phone,state.selectedStep);
  else if(action==='reopen')restoreMenu(phone);
  else if(action==='close'||action==='skip'){
    phone.querySelector('.directory').hidden=true;
    phone.querySelector('.stage').insertAdjacentHTML('beforeend','<section class="menu-closed"><strong>'+(action==='skip'?'已跳过指引':'目录已关闭')+'</strong><p>这只是预览，不会影响正式应用</p><button data-action="reopen">重新打开目录</button></section>');
    phone.querySelector('.menu-closed button').focus({preventScroll:true});
  }
}
function updateCaption(){
  const selected=THEMES.find(t=>t.id===themeSelect.value);
  document.getElementById('theme-caption').textContent=(selected?selected.name:'全部 12 个主题')+' / '+(mode==='light'?'浅色':'深色')+' · 各主题独立使用正式色值与同系派生色';
}
function applyTheme(){
  document.documentElement.dataset.appearance=mode;
  document.querySelectorAll('.phone').forEach(phone=>{
    const p=palette(themeFor(phone));
    setPalette(phone,p);phone.dataset.mode=mode;
    phone.closest('.theme-study').querySelectorAll('[data-swatch]').forEach(el=>el.style.background=p[el.dataset.swatch]);
  });
  document.querySelectorAll('button[data-mode]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.mode===mode)));
  updateCaption();
}
function filterThemes(){
  const selected=themeSelect.value;
  document.querySelectorAll('.theme-study').forEach(el=>el.hidden=selected!=='all'&&el.dataset.theme!==selected);
  document.getElementById('gallery').dataset.view=selected==='all'?'all':'single';
  updateCaption();
}
const gallery=document.getElementById('gallery');
THEMES.forEach((t,index)=>{
  themeSelect.add(new Option(t.name,t.id));
  const article=document.createElement('article');
  article.className='theme-study';article.dataset.theme=t.id;
  article.style.setProperty('--order',String(index%3));
  article.innerHTML='<header class="theme-study-heading"><div class="theme-study-title"><span aria-hidden="true">'+pad(index+1)+'</span><h2>'+t.name+'</h2></div><div class="theme-study-swatches" aria-label="'+t.name+'的色彩分区"><i data-swatch="strong"></i><i data-swatch="paper"></i><i data-swatch="low"></i><i data-swatch="accent"></i></div></header><div class="phone" data-design="hybrid" data-theme="'+t.id+'" aria-label="'+t.name+'主题的使用指引目录"></div>';
  gallery.appendChild(article);
});
themeSelect.onchange=filterThemes;
document.querySelectorAll('button[data-mode]').forEach(button=>button.onclick=()=>{mode=button.dataset.mode;applyTheme();});
progressSelect.onchange=()=>{
  document.querySelectorAll('.phone').forEach(phone=>renderPhone(phone,Number(progressSelect.value)));
  applyTheme();notify('所有主题已切换为'+(progressSelect.value==='1'?'首次进入':'继续第 17 步')+'状态，仅影响此预览');
};
document.addEventListener('keydown',event=>{
  if(event.key!=='Escape')return;
  const phone=document.activeElement?.closest('.phone');
  if(!phone)return;
  if(phone.querySelector('.chapter-drawer'))phone.querySelector('[data-action=back]').click();
  else if(phone.querySelector('.preview-entry'))restoreMenu(phone);
  else if(!phone.querySelector('.menu-closed'))phone.querySelector('[data-action=close]').click();
});
document.querySelectorAll('.phone').forEach(phone=>renderPhone(phone,1));
applyTheme();filterThemes();
</script>
</body>
</html>
